name: Deploy U-Pack Bilingual Catalog to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compute SITE_URL and BASE_PATH
        id: paths
        shell: bash
        run: |
          if [ -n "${{ vars.SITE_URL }}" ]; then
            echo "site_url=${{ vars.SITE_URL }}" >> "$GITHUB_OUTPUT"
            echo "base_path=${{ vars.BASE_PATH || '/' }}" >> "$GITHUB_OUTPUT"
          else
            ORIGIN="${{ steps.pages.outputs.origin }}"
            BASE="${{ steps.pages.outputs.base_path }}"
            echo "site_url=${ORIGIN:-https://${GITHUB_REPOSITORY_OWNER}.github.io}" >> "$GITHUB_OUTPUT"
            echo "base_path=${BASE:-/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build static bilingual Astro site
        env:
          SITE_URL: ${{ steps.paths.outputs.site_url }}
          BASE_PATH: ${{ steps.paths.outputs.base_path }}
          PUBLIC_ANALYTICS_WEBHOOK: ${{ vars.ANALYTICS_WEBHOOK || '' }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
